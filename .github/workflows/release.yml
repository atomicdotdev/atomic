name: Release

on:
  # Push to the release branch (legacy/manual path) or a version tag.
  push:
    branches: [release]
    tags: ['v*']
  # Callable from the Prepare Release dispatch workflow, which bumps the
  # version, merges dev into release, and then invokes this build directly.
  # Invoking via workflow_call runs in the same workflow run, so it works
  # with the default GITHUB_TOKEN (no PAT needed to chain the build).
  workflow_call:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to build the release from."
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: atomic
  # Linux release binaries must run on all supported LTS distributions,
  # including RHEL 9. Keep this explicit so runner upgrades cannot silently
  # raise the minimum required glibc version.
  GLIBC_MIN: "2.28"
  CARGO_ZIGBUILD_VERSION: "0.23.4"
  ZIG_VERSION: "0.16.0"

jobs:
  # ---------------------------------------------------------------------------
  # Extract version from Cargo.toml for tagging and release naming
  # ---------------------------------------------------------------------------
  version:
    name: Extract Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}"

  # ---------------------------------------------------------------------------
  # Build release binaries for each target platform
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    needs: [version]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc — requires glibc 2.28+)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: atomic-x86_64-unknown-linux-gnu.tar.gz
            build_mode: zig
            verify_glibc: true

          # Linux x86_64 (musl — statically linked, works on any Linux)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: atomic-x86_64-unknown-linux-musl.tar.gz
            build_mode: zig
            musl: true
            verify_glibc: false

          # Linux aarch64 (glibc, cross-compiled)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: atomic-aarch64-unknown-linux-gnu.tar.gz
            build_mode: zig
            verify_glibc: true

          # Linux aarch64 (musl — statically linked, works on any Linux)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: atomic-aarch64-unknown-linux-musl.tar.gz
            build_mode: zig
            musl: true
            verify_glibc: false

          # macOS x86_64 (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: atomic-x86_64-apple-darwin.tar.gz
            build_mode: native
            verify_glibc: false

          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: atomic-aarch64-apple-darwin.tar.gz
            build_mode: native
            verify_glibc: false

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: atomic-x86_64-pc-windows-msvc.zip
            build_mode: native
            verify_glibc: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: matrix.build_mode == 'zig'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.build_mode }}-zig-${{ env.ZIG_VERSION }}-glibc-${{ env.GLIBC_MIN }}-cargo-zigbuild-${{ env.CARGO_ZIGBUILD_VERSION }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-${{ matrix.build_mode }}-zig-${{ env.ZIG_VERSION }}-glibc-${{ env.GLIBC_MIN }}-cargo-zigbuild-${{ env.CARGO_ZIGBUILD_VERSION }}-cargo-release-

      - name: Install cargo-zigbuild
        if: matrix.build_mode == 'zig'
        run: cargo install --locked cargo-zigbuild --version "${CARGO_ZIGBUILD_VERSION}"

      - name: Build release binary
        if: matrix.build_mode == 'native'
        run: cargo build --release --target ${{ matrix.target }} -p atomic-cli

      - name: Build Linux release binary with glibc floor
        if: matrix.build_mode == 'zig' && !matrix.musl
        run: cargo zigbuild --release --target "${{ matrix.target }}.${GLIBC_MIN}" -p atomic-cli

      - name: Build statically linked Linux release binary
        if: matrix.musl
        run: cargo zigbuild --release --target ${{ matrix.target }} -p atomic-cli

      - name: Verify Linux glibc floor
        if: matrix.verify_glibc
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/${BINARY_NAME}"
          MAX_GLIBC=$(
            readelf -W --version-info "$BINARY" \
              | sed -n 's/.*Name: GLIBC_\([0-9][0-9.]*\).*/\1/p' \
              | sort -V \
              | tail -1
          )

          if [[ -z "$MAX_GLIBC" ]]; then
            echo "::error::Could not determine the minimum glibc version for $BINARY"
            exit 1
          fi

          HIGHEST=$(printf '%s\n%s\n' "$GLIBC_MIN" "$MAX_GLIBC" | sort -V | tail -1)
          if [[ "$HIGHEST" != "$GLIBC_MIN" ]]; then
            echo "::error::$BINARY requires glibc $MAX_GLIBC, above the supported floor $GLIBC_MIN"
            exit 1
          fi

          echo "$BINARY requires glibc $MAX_GLIBC (supported floor: $GLIBC_MIN)"

      # Package: Unix (tar.gz)
      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} staging/
          cp README.md LICENSE staging/ 2>/dev/null || true
          cd staging
          tar czf ../${{ matrix.artifact }} ./*

      # Package: Windows (zip)
      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe" staging/
          Copy-Item README.md, LICENSE staging/ -ErrorAction SilentlyContinue
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all platform binaries
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [build, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Full history so generate-notes can diff against the previous tag
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) | while read -r f; do
            sha256sum "$f" >> ../checksums-sha256.txt
          done
          cd ..
          cat checksums-sha256.txt

      - name: Generate release notes (GitHub Copilot)
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # Find the previous release tag to bound the commit range.
          PREV_TAG=$(gh release list --repo "$REPO" --limit 10 --json tagName \
            --jq '[.[].tagName | select(. != env.TAG)] | first // ""')

          # Call GitHub's generate-notes API (powers the Copilot-assisted
          # "Auto-generate release notes" button in the GitHub UI).
          # Omit previous_tag_name entirely on the first release — the API
          # rejects null and there is no prior tag to diff against anyway.
          if [[ -n "$PREV_TAG" ]]; then
            PAYLOAD=$(jq -n --arg tag "$TAG" --arg prev "$PREV_TAG" \
              '{tag_name: $tag, previous_tag_name: $prev}')
          else
            PAYLOAD=$(jq -n --arg tag "$TAG" \
              '{tag_name: $tag}')
          fi

          NOTES=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/releases/generate-notes" \
            --input - <<< "$PAYLOAD" \
            --jq '.body')

          # Prepend the installation instructions to the generated notes.
          INSTALL=$(cat <<'INSTALL_EOF'
          ## Installation

          Download the binary for your platform below, extract it, and add it to your `PATH`.

          ### macOS (Apple Silicon)
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/atomic-aarch64-apple-darwin.tar.gz | tar xz
          sudo mv atomic /usr/local/bin/
          ```

          ### macOS (Intel)
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/atomic-x86_64-apple-darwin.tar.gz | tar xz
          sudo mv atomic /usr/local/bin/
          ```

          ### Linux (x86_64, statically linked — works on any Linux including Ubuntu 20.04+)
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/atomic-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv atomic /usr/local/bin/
          ```

          ### Linux (x86_64, glibc — requires glibc 2.28+)
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/atomic-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv atomic /usr/local/bin/
          ```

          ### Linux (aarch64, statically linked — works on any Linux)
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/atomic-aarch64-unknown-linux-musl.tar.gz | tar xz
          sudo mv atomic /usr/local/bin/
          ```

          ### Linux (aarch64, glibc — requires glibc 2.28+)
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/atomic-aarch64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv atomic /usr/local/bin/
          ```

          ### Windows (x86_64)
          Download `atomic-x86_64-pc-windows-msvc.zip`, extract, and add to your `PATH`.

          ### Verify
          ```bash
          atomic --version
          ```

          ---

          See [checksums-sha256.txt](https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/checksums-sha256.txt) for SHA-256 checksums of all artifacts.

          ---

          INSTALL_EOF
          )

          # Write the combined body to a file (avoids shell quoting issues).
          printf '%s\n%s\n' "$INSTALL" "$NOTES" > release-notes.md
          echo "Generated release notes:"
          cat release-notes.md

      - name: Resolve target commit
        id: target
        # Use the commit actually checked out (the release branch/tag/SHA),
        # not github.sha — under workflow_call the latter is the caller's ref.
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          PRERELEASE_FLAG=""
          if echo "$VERSION" | grep -q '-'; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ steps.target.outputs.sha }}" \
            --title "Atomic ${TAG}" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG \
            artifacts/*.tar.gz \
            artifacts/*.zip \
            checksums-sha256.txt
