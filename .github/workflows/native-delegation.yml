name: Native delegation consumer

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-delegation-consumer:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      OBSERVER_COMMIT: 16d31f6ae1874389a6d5dc56e54997b88a7e2397
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Generate native packet from the actual host checkout
        run: python3 tools/native-evaluation/run.py --output "$RUNNER_TEMP/atomic-native-packet" --jobs 2
      - name: Fetch the reviewed consumer source
        uses: actions/checkout@v4
        with:
          repository: probityai/agent-evidence-observer
          ref: 16d31f6ae1874389a6d5dc56e54997b88a7e2397
          path: .native-observer-source
          persist-credentials: false
      - name: Build and install the pinned consumer wheel
        run: |
          test "$(git -C .native-observer-source rev-parse HEAD)" = "$OBSERVER_COMMIT"
          python3 -m venv "$RUNNER_TEMP/observer-build-env"
          "$RUNNER_TEMP/observer-build-env/bin/python" -m pip install build==1.3.0 setuptools==80.9.0 wheel==0.45.1
          "$RUNNER_TEMP/observer-build-env/bin/python" -m build --no-isolation --wheel --outdir "$RUNNER_TEMP/observer-dist" .native-observer-source
          python3 -m venv "$RUNNER_TEMP/observer-consumer-env"
          "$RUNNER_TEMP/observer-consumer-env/bin/python" -m pip install cryptography==46.0.7 "$RUNNER_TEMP"/observer-dist/*.whl
      - name: Select host inputs and check native bytes with the installed reader
        run: |
          python3 tools/native-evaluation/check_consumer.py \
            --packet "$RUNNER_TEMP/atomic-native-packet" \
            --expected-source "$(git rev-parse HEAD)" \
            --observer-source-commit "$OBSERVER_COMMIT" \
            --reader "$RUNNER_TEMP/observer-consumer-env/bin/agent-evidence-read-atomic" \
            --reader-python "$RUNNER_TEMP/observer-consumer-env/bin/python" \
            --wheel "$RUNNER_TEMP"/observer-dist/*.whl \
            --output "$RUNNER_TEMP/atomic-native-consumer"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomic-native-consumer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/atomic-native-packet/
            ${{ runner.temp }}/atomic-native-consumer/
            ${{ runner.temp }}/observer-dist/*.whl
          if-no-files-found: error
