name: CI

on:
  pull_request:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - '**.markdown'
  # Pull requests can only restore caches saved by their own ref or by the base
  # branch, so `dev` has to run CI to seed the caches every PR starts from.
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - '**.markdown'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and dependency builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: cargo check
        run: cargo check --workspace

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Line tables keep file:line in backtraces but link far faster and keep
      # target/ (and the cache) much smaller than full debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # Build-script dependencies default to no debug info, except crates that
      # are also normal dependencies, which take the line above. Which crates
      # those are differs between the nextest build and the lib-only doctest
      # build (shlex, which cc depends on), so without this the doctest step
      # rebuilt cc, every crate whose build script uses it, and everything
      # above them.
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      # Filesystem-heavy tests run ~12x slower on Windows than on Linux
      # (atomic_repository unit tests: 11m vs 54s). A ReFS Dev Drive skips
      # NTFS overhead and runs Defender in performance mode, so the build
      # and the tests' temp directories live there.
      - name: Set up Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          # Dynamic VHDX on the runner's D: disk: it only uses what target/ needs.
          # 14GB ran out while linking the test binaries.
          drive-size: 60GB
          mount-path: ${{ runner.workspace }}/devdrive
          env-mapping: |
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
            TMP,{{ DEV_DRIVE }}/tmp
            TEMP,{{ DEV_DRIVE }}/tmp

      - name: Create Dev Drive temp directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:TMP | Out-Null

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test native runtime packaging
        run: node --test libatomic/scripts/package-runtime.test.mjs

      - name: Cache cargo registry and dependency builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.os == 'Windows' && '. -> ../devdrive/target' || '. -> target' }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests
        # Temporary PR #207 policy: Git shim integration suites are Unix-only
        # (cfg(unix)); Linux/macOS still run them. Keep Windows native tests on.
        # Re-enable the shim suites after Windows support is defined and its
        # path/mode/locking behavior is validated; see the RFC platform policy.
        run: cargo nextest run --workspace --features atomic-cli/adoption-test-injection --profile ci

      # nextest does not run doctests.
      - name: Run doctests
        run: cargo test --workspace --doc --features atomic-cli/adoption-test-injection --no-fail-fast

      - name: Run CLI semantic diff harness
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ATOMIC_BIN="$PWD/target/debug/atomic" bash tests/harness/run_all.sh 09

      - name: Run knowledge graph closure harness
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        # The harness's own cargo test suites already ran under nextest above.
        env:
          ATOMIC_HARNESS_SKIP_CARGO_TESTS: 1
        run: ATOMIC_BIN="$PWD/target/debug/atomic" bash tests/harness/46_knowledge_graph_closure.sh

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and dependency builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and dependency builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.90

      - name: Cache cargo registry and dependency builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: cargo check (shared library MSRV)
        run: cargo check --workspace --exclude atomic-cli --exclude atomic-shacl --locked

      - uses: dtolnay/rust-toolchain@1.98

      - name: cargo check (CLI and SHACL MSRV)
        run: cargo check -p atomic-cli -p atomic-shacl --locked
