name: Provenance DSSE interoperability

on:
  pull_request:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - '**.markdown'
  # Seeds the cache that pull requests restore; see ci.yml.
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - '**.markdown'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  export-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache cargo registry and dependency builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Install independent Ed25519 verifier
        run: python -m pip install 'cryptography==50.0.0'
      - name: Feature API tests and examples
        run: cargo test --locked -p atomic-canonical --features dsse-export
      - name: Real CLI export and independent consumption
        run: cargo test --locked -p atomic-cli --features dsse-export --test it provenance_integration_test
        env:
          ATOMIC_DSSE_PYTHON: python
      - name: Feature lint
        run: cargo clippy --locked --no-deps -p atomic-canonical -p atomic-cli --features dsse-export -- -D warnings
