[package]
name = "atomic-shacl"
description = "Recording the Why — a real SHACL engine (oxirs) over Turtle shapes, run in shadow against the hand-coded gate. The pre-1.0 RDF/SHACL stack is gated behind the off-by-default `oxirs-engine` feature and isolated here; atomic-canonical never depends on this crate."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The canonical node types + the Violation/ValidationReport vocab we mirror and
# diff against. The dependency arrow is strictly one-directional:
# atomic-cli -> atomic-shacl -> atomic-canonical. atomic-canonical NEVER depends back.
atomic-canonical = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# The isolated, pre-1.0 SHACL/RDF stack (oxirs). OPTIONAL and OFF by default:
# only the `oxirs-engine` feature pulls the ~430-crate transitive tree, so
# routine workspace builds and CI never compile it. oxirs-core provides both the
# RDF model (NamedNode/Literal/Quad) and the validation Store (ConcreteStore);
# oxirs-shacl provides the shape loader + validation engine (both synchronous).
oxirs-shacl = { workspace = true, optional = true }
oxirs-core = { workspace = true, optional = true }
# oxirs-shacl's ValidationEngine::new wants an IndexMap<ShapeId, Shape>; matched
# to the version oxirs-shacl itself uses (2.14) to avoid a duplicate indexmap.
indexmap = { version = "2.14", optional = true }

[features]
default = []
# Enables the real oxirs SHACL engine and its large transitive dependency tree.
# OFF by default (see the crate description). The differential-corpus tests and
# any real validation require this feature: `cargo test -p atomic-shacl --features oxirs-engine`.
oxirs-engine = ["dep:oxirs-shacl", "dep:oxirs-core", "dep:indexmap"]

[dev-dependencies]
atomic-identity = { workspace = true }
