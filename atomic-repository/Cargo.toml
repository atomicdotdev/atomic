[package]
name = "atomic-repository"
description = "High-level repository operations for Atomic VCS"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
atomic-core = { workspace = true }
atomic-config = { workspace = true }
atomic-identity = { workspace = true }
atomic-semantic = { workspace = true, optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
redb = { workspace = true }
zstd = { workspace = true }
dirs = "5.0"
walkdir = { workspace = true }
ignore = { workspace = true }
syntext = { workspace = true }
# syntext depends on roaring ^0.11; roaring 0.11.4 requires Rust 1.90.
# Keep the selected 0.11 release compatible with the workspace MSRV (1.87).
roaring = "=0.11.3"
tempfile = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
tokio = { workspace = true }

[features]
default = ["ast"]
ast = ["atomic-semantic"]

[dev-dependencies]
tempfile = { workspace = true }
