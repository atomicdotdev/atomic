# Curated registry of externally-packaged agent integrations.
#
# Each entry maps an adapter name (see hooks::AgentRegistry) to the public
# Atomic storage project that hosts its integration package. `enable` pulls
# the package with Atomic's own sync and installs it per the package's
# atomic-integration.toml manifest.
#
# Bumping an integration = one-line PR to this file (pin a tag once the
# package has one). `view` is the view pulled when no tag is pinned.

schema = 1

[agents.agy]
url = "https://atomic.atomic.storage/workspaces/oss/projects/atomic-agy/code"
view = "release"

