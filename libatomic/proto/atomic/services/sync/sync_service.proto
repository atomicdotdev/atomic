// atomic-protocol — SyncService definition (the RPC contract).
// DRAFT — add-only. Messages for this service live in
// atomic/services/sync/sync_messages.proto · shared primitives in atomic/common/.

syntax = "proto3";

package atomic;

import "atomic/common/options.proto";
import "atomic/services/sync/sync_messages.proto";

service SyncService {
  // `atomic push [--remote]` — upload view manifests + CAS objects to the
  // remote; the hosted server implements the receiving counterpart.
  rpc PushChanges(PushChangesRequest) returns (PushChangesResponse) {
    option (atomic.execution_scope) = EXECUTION_SCOPE_LOCAL;
    option (atomic.required_capability) = "sync.write";
    option (atomic.required_capability) = "repository.read";
    option (atomic.allowed_caller) = CALLER_CLASS_LOCAL;
    option (atomic.effect) = RPC_EFFECT_REPOSITORY_READ;
    option (atomic.effect) = RPC_EFFECT_EXTERNAL_IO;
    option (atomic.effect) = RPC_EFFECT_DAEMON_WRITE; // replay/outcome ledger
  }
  // `atomic pull [--remote]` — download + apply; imports provenance and
  // attestation sidecars through ProvenanceService/AttestationService on
  // apply (the sidecar path becomes service calls, not direct writes).
  rpc PullChanges(PullChangesRequest) returns (PullChangesResponse) {
    option (atomic.execution_scope) = EXECUTION_SCOPE_LOCAL;
    option (atomic.required_capability) = "sync.read";
    option (atomic.required_capability) = "repository.write";
    option (atomic.allowed_caller) = CALLER_CLASS_LOCAL;
    option (atomic.effect) = RPC_EFFECT_REPOSITORY_WRITE;
    option (atomic.effect) = RPC_EFFECT_EXTERNAL_IO;
  }
  // `atomic remote list` (+ bare `atomic remote`) — read-only listing;
  // its own RPC so a list never gates on a write capability and never
  // enters the write queue (remotes persist in the repository DB, but
  // reading them is a concurrent read transaction under the daemon).
  rpc ListRemotes(ListRemotesRequest) returns (ListRemotesResponse) {
    option (atomic.execution_scope) = EXECUTION_SCOPE_LOCAL;
    option (atomic.required_capability) = "repository.read";
    option (atomic.allowed_caller) = CALLER_CLASS_LOCAL;
    option (atomic.effect) = RPC_EFFECT_REPOSITORY_READ;
  }
  // `atomic remote add|remove|rename|set-url|default` — one RPC, action
  // enum, MUTATING actions only (list lives in ListRemotes).
  rpc ManageRemotes(ManageRemotesRequest) returns (ManageRemotesResponse) {
    option (atomic.execution_scope) = EXECUTION_SCOPE_LOCAL;
    option (atomic.required_capability) = "repository.write";
    option (atomic.allowed_caller) = CALLER_CLASS_LOCAL;
    option (atomic.effect) = RPC_EFFECT_REPOSITORY_WRITE;
  }
  // `atomic project init` — bind the local repository to a remote project.
  rpc BindRemoteProject(BindRemoteProjectRequest) returns (BindRemoteProjectResponse) {
    option (atomic.execution_scope) = EXECUTION_SCOPE_LOCAL;
    option (atomic.required_capability) = "repository.write";
    option (atomic.allowed_caller) = CALLER_CLASS_LOCAL;
    option (atomic.effect) = RPC_EFFECT_REPOSITORY_WRITE;
  }
}
