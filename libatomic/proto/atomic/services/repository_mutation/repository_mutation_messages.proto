// atomic-protocol — RepositoryMutationService: working-copy and change-graph
// mutations.
//
// DRAFT — add-only. Every mutation carries RequestMeta (idempotency key) and
// an ExpectedState precondition where the caller knows prior state (RFC
// 2.2/2.3: expected-Merkle/sequence preconditions on mutating operations —
// the fencing pattern generalized from provenance to ALL mutations).
// Mutations commit their repository event to the outbox in the SAME write
// transaction (RFC D8). Writes queue per repository (bounded FIFO); the
// working-copy mutations additionally hold the workspace mutation lease
// (lock order: workspace lease → write-queue permit → redb write txn).

syntax = "proto3";

package atomic;

import "google/protobuf/timestamp.proto";
import "atomic/common/common.proto";
import "atomic/common/change.proto";   // ChangeInfo, ConflictInfo



message AddFilesRequest {
  RepositoryRef repository = 1;
  RequestMeta meta = 2;
  repeated string paths = 3;         // working-copy paths
  optional ExpectedState expected = 4;
}
message AddFilesResponse {
  uint32 tracked = 1;
  ResponseMeta meta = 100;
}

message RemoveFilesRequest {
  RepositoryRef repository = 1;
  RequestMeta meta = 2;
  repeated string paths = 3;
  bool keep_working_copy = 4;        // `--keep`
}
message RemoveFilesResponse {
  uint32 removed = 1;
  ResponseMeta meta = 100;
}

message MoveFileRequest {
  RepositoryRef repository = 1;
  RequestMeta meta = 2;
  string source = 3;
  string destination = 4;
}
message MoveFileResponse { ResponseMeta meta = 100; }

message RestoreRequest {
  RepositoryRef repository = 1;
  RequestMeta meta = 2;
  repeated string paths = 3;         // empty = whole tree
  bool force = 4;
  reserved 5; // preview is read-only RepositoryQueryService.PreviewRestore
}
message RestoreResponse {
  repeated string restored = 1;
  ResponseMeta meta = 100;
}

message RecordRequest {
  RepositoryRef repository = 1;
  RequestMeta meta = 2;
  string message = 3;
  repeated string paths = 4;        // empty = tracked-files snapshot
  optional ExpectedState expected = 5; // required matching view_snapshot;
  // snapshot.view must equal this workspace's current view when publishing.
}
message RecordResponse {
  ChangeInfo change = 1;
  optional Hash view_merkle = 2;      // post-record state for the next
                                      // expected-state precondition
  optional string view = 3;           // view the change landed on (add-only)
  ResponseMeta meta = 100;
}

message ReviseRequest {
  RepositoryRef repository = 1;
  RequestMeta meta = 2;
  ChangeRef target = 3;
  optional string reword_message = 4;  // `--reword`
  optional ExpectedState expected = 5; // required matching view_snapshot
}
message ReviseResponse {
  ChangeInfo change = 1;
  ResponseMeta meta = 100;
}

message InsertChangesRequest {
  RepositoryRef repository = 1;
  RequestMeta meta = 2;
  // Bare CLI promotion resolves source and parent; the daemon has no caller cwd.
  reserved 3, 8, 10, 11;
  oneof source {
    Hash single_change = 4;
    string from_view = 5;
    string up_to_tag = 6;
  }
  optional string target_view = 7; // display hint; must agree with target.view
  bool allow_conflicts = 9;
  ViewRef target = 12;
  ViewSnapshot expected_snapshot = 13;
  optional ViewSnapshot source_snapshot = 14; // required for from_view/tag
  // Dependency closure is mandatory; a confirmation flag cannot bypass policy.
}
message InsertChangesResponse {
  repeated ChangeInfo inserted = 1;
  reserved 2;
  repeated ConflictInfo conflicts = 3;  // when allowed & occurred
  ResponseMeta meta = 100;
}

message UnrecordRequest {
  RepositoryRef repository = 1;
  RequestMeta meta = 2;
  reserved 3;
  optional ExpectedState expected = 4;
  ViewRef view = 5; // required; expected.kind must be matching view_snapshot
  optional ChangeRef target = 6; // absent means last reference in this view
}
message UnrecordResponse {
  optional ChangeInfo removed = 1;
  reserved 2;
  ResponseMeta meta = 100;
}

message CreateStashRequest {
  RepositoryRef repository = 1;
  RequestMeta meta = 2;
  optional string message = 3;       // uncommitted work stashed onto an
                                      // orphan view
  // `atomic stash push -u` (add-only): include untracked files.
  bool include_untracked = 4;
  // `atomic stash push -k` (add-only): keep the working copy dirty.
  bool keep = 5;
}
message CreateStashResponse {
  string stash_id = 1;
  ResponseMeta meta = 100;
}

message ApplyStashRequest {
  RepositoryRef repository = 1;
  RequestMeta meta = 2;
  string stash_id = 3;
  reserved 4; // CLI pop composes ApplyStash then explicit DropStash
}
message ApplyStashResponse {
  repeated string applied = 1;
  ResponseMeta meta = 100;
}

message ListStashesRequest {
  RepositoryRef repository = 1;
}
message ListStashesResponse {
  repeated StashInfo stashes = 1;
}
message StashInfo {
  string id = 1;
  optional string message = 2;
  optional google.protobuf.Timestamp created_at = 3;
  optional Hash tree = 4;
  // SHAPE-CONFIRM: orphan-view stash details from commands/stash.rs.
}

message DropStashRequest {
  RepositoryRef repository = 1;
  RequestMeta meta = 2;
  optional string stash_id = 3;      // absent + all = `stash clear`
  bool all = 4;
}
message DropStashResponse { ResponseMeta meta = 100; }
