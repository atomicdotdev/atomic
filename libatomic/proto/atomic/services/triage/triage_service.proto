// atomic-protocol — TriageService definition (the RPC contract).
// Add-only. Messages for this service live in
// atomic/services/triage/triage_messages.proto · shared primitives in atomic/common/.

syntax = "proto3";

package atomic;

import "atomic/common/options.proto";
import "atomic/services/triage/triage_messages.proto";

service TriageService {
  // `atomic triage candidates`
  rpc ListTriageCandidates(ListTriageCandidatesRequest) returns (ListTriageCandidatesResponse) {
    option (atomic.execution_scope) = EXECUTION_SCOPE_BOTH;
    option (atomic.required_capability) = "triage.read";
    option (atomic.allowed_caller) = CALLER_CLASS_LOCAL;
    option (atomic.allowed_caller) = CALLER_CLASS_REMOTE_IDENTITY;
    option (atomic.effect) = RPC_EFFECT_REPOSITORY_READ;
  }
  // `atomic triage review [--json]`
  rpc GenerateTriageReview(GenerateTriageReviewRequest) returns (GenerateTriageReviewResponse) {
    option (atomic.execution_scope) = EXECUTION_SCOPE_BOTH;
    option (atomic.required_capability) = "triage.read";
    option (atomic.allowed_caller) = CALLER_CLASS_LOCAL;
    option (atomic.allowed_caller) = CALLER_CLASS_REMOTE_IDENTITY;
    option (atomic.effect) = RPC_EFFECT_REPOSITORY_READ;
  }
}
