// atomic-protocol — RepositoryQueryService: read-only repository operations.
//
// DRAFT — add-only. Reads execute as independent concurrent read
// transactions (RFC concurrency model); no global write lock is ever assumed.
// LOCAL-scoped reads are working-copy-aware (status/DiffWorkingCopy against the
// tree); BOTH reads (log/change/Diff/PreviewMutation) are semantically identical on
// the local daemon and the hosted server (D6/D7 — the CLI-vs-RPC parity
// targets).

syntax = "proto3";

package atomic;

import "atomic/common/common.proto";
import "atomic/common/change.proto";
import "atomic/common/pagination.proto";



message StatusRequest {
  RepositoryRef repository = 1;
  reserved 2; // allow_reindex violated read-only execution
  // The caller's status options (add-only), mirroring StatusOptions
  // (atomic-repository/src/status.rs). Absent = all defaults. The daemon
  // computes status with exactly these, so `--no-untracked`, a path scope,
  // and ignore handling behave identically on the local body and the wire
  // — one source of truth for what a status read means.
  optional StatusOptions options = 3;
}
// Mirrors StatusOptions (atomic-repository/src/status.rs:640). Every field
// is an optional wrapper so an explicit `false` is distinguishable from
// unset; unset resolves to the field's domain default (noted per field).
message StatusOptions {
  optional bool include_untracked = 1;     // default true
  optional bool include_ignored = 2;       // default false
  optional bool respect_ignore_files = 3;  // default true
  optional bool hash_contents = 4;         // default true
  repeated string path_filters = 5;        // default empty (no filter)
}
// Mirrors RepositoryStatus (atomic-repository/src/status.rs:390): view,
// merkle state, per-file entries, and the stale-index count that drives the
// --reindex hint (unindexed tracked files are conservatively reported
// Modified; explicit ReindexWorkspace resolves them).
message StatusResponse {
  string view = 1;
  optional Hash view_merkle = 2;
  repeated FileStatusEntry files = 3;
  uint32 modified_count = 4;
  uint32 deleted_count = 5;
  uint32 untracked_count = 6;
  uint32 added_count = 7;
  uint32 conflicted_count = 8;
  uint32 stale_index_count = 9;   // non-zero → `status --reindex` would
                                    // resolve false positives
  ViewSnapshot snapshot = 10;
  bool needs_reindex = 11;         // stale_index_count > 0
}
// atomic's file-status vocabulary, source-verified (status.rs:136):
// Modified, Deleted, Untracked, Added, Conflicted — no git-shaped states.
enum FileStatus {
  FILE_STATUS_UNSPECIFIED = 0;
  FILE_STATUS_MODIFIED = 1;
  FILE_STATUS_DELETED = 2;
  FILE_STATUS_UNTRACKED = 3;
  FILE_STATUS_ADDED = 4;
  FILE_STATUS_CONFLICTED = 5;
  FILE_STATUS_PENDING_UNTRACK = 6;   // staged by `remove --keep`; the next record deletes it
}
// Mirrors FileStatusEntry (status.rs:263).
message FileStatusEntry {
  string path = 1;
  FileStatus status = 2;
  optional uint64 inode = 3;         // opaque handle; present for tracked files
  optional Hash recorded_hash = 4;   // recorded graph content
  optional Hash current_hash = 5;    // on-disk content when hashed
  optional string details = 6;       // conflict type, permissions, etc.
}

message LogRequest {
  RepositoryRef repository = 1;
  bool all_views = 2;                  // `--all`
  optional string view = 3; // required unless all_views; no daemon current-view default
  optional PageCursor cursor = 4;
  optional PageBudget budget = 5;
  repeated string path_filter = 6;      // `--path`: entries whose changes touch it
  bool tags_only = 7;                  // tagged entries only
}
message LogResponse {
  repeated ChangeLogEntry entries = 1;
  optional PageCursor next_cursor = 2;
}
// ChangeLogEntry lives in atomic/common/change.proto (shared change-domain).

message GetChangeRequest {
  RepositoryRef repository = 1;
  ChangeRef ref = 2;
  ChangeIncludes includes = 3;
  optional ViewRef view = 4; // required when ref is a view-log sequence
  // Reconstruct the per-file content around the change (add-only):
  // `diff -c` needs each touched file's pre/post-change bytes — the
  // legacy no-file_ops fallback and the FileOps context padding. The
  // handler reads them from the graph; the response carries them.
  bool include_file_contents = 5;
}
// Sections fetched by flag instead of by verb — the combine that keeps
// GetChange one RPC.
message ChangeIncludes {
  bool metadata = 1;
  bool graph_section = 2;
  bool semantic_section = 3;
  bool signatures = 4;
  bool content_chunks = 5;
  bool blast_radius = 6; // opt-in structural analysis for this change, read-only
}
message GetChangeResponse {
  ChangeInfo change = 1;
  optional VersionedBytes graph_section = 2;
  optional VersionedBytes semantic_section = 3;
  repeated ChangeSignature signatures = 4;
  optional bytes content_chunks = 5;
  // The complete change as versioned-opaque bytes (schema
  // "atomic.change.v3") — deserialize with atomic-core for full-detail
  // rendering (hunks, content, unhashed sections) without a second
  // server-side render per client need.
  optional VersionedBytes change_bundle = 6;
  // The causal decision graph(s) explaining this change (schema
  // "atomic.prov.graph.v1", one per covering graph, in order).
  repeated VersionedBytes provenance_ledger = 7;
  // The change's sequence on the resolved view, when known.
  optional uint64 sequence = 8;
  // Per-file reconstructed content (add-only), present when the request
  // set include_file_contents: each touched file's bytes before and after
  // the change, as the graph holds them.
  repeated ChangeFileContent file_contents = 9;
  // Stored identities of provenance_ledger, in the same order and with the
  // same length. Carry the original hashes: reserializing a graph upgraded
  // from an older storage schema may produce a different content hash.
  repeated Hash provenance_ledger_hashes = 10;
  // Safe decoded projection of the canonical change when includes.metadata is
  // true. The V3 bundle remains available; JS clients need not decode it.
  optional ChangeMetadata metadata = 11;
  optional ChangeBlastRadius blast_radius = 12;
  // Change-local governing plan declarations and separately labeled intent
  // document associations. Present with includes.metadata; no validation run.
  optional ChangeIntentContext intent_context = 13;
}

message ChangeIntentContext {
  uint32 schema_version = 1; // 1
  Hash change_hash = 2;
  optional string plan_id = 3; // one known recorded governing reference; not inferred
  string status = 4; // recorded | missing | ambiguous | partial
  repeated ChangePlanBinding plans = 5;
  repeated ChangeIntentAssociation associated_intents = 6;
  repeated string warnings = 7;
  string validation_status = 8; // not_checked; absence is NOT SHACL failure
  string context = 9;
}
message ChangeIntentIdentity {
  string id = 1; // current display ID, resolved by Atomic (may be a human key)
  string uid = 2; // stable identity when stored; empty for older intents
  string title = 3;
  string path = 4; // validated repository-relative .vault/intents/... source
}
message ChangePlanBinding {
  string plan_id = 1; // exact recorded value, retained even if vault lookup fails
  string source = 2; // provenance_graph | session_turn
  string session_id = 3;
  Hash provenance_hash = 4;
  optional uint32 turn_number = 5; // only for a matched indexed turn, zero-based
  optional ChangeIntentIdentity intent = 6;
}
message ChangeIntentAssociation {
  string path = 1; // intent document actually touched by this selected change
  optional ChangeIntentIdentity intent = 2; // current stored identity, not signed history
  repeated string commitment_node_ids = 3; // committed_via to a patch for this hash
  repeated string patch_node_ids = 4;
  repeated Hash provenance_hashes = 5;
}

// Direct paths are immutable change data. Structural links are observations of
// the CURRENT repository KG, not a historical/view-isolated graph snapshot.
message ChangeBlastRadius {
  Hash change_hash = 1;
  string mode = 2; // structural | private | partial
  repeated ChangeImpactFile files = 3; // distinct paths, direct files win
  repeated ChangeImpactEdge edges = 4; // incoming CALLS / INCLUDES, never co-change
  repeated string warnings = 5;
  string context = 6;
}
message ChangeImpactFile {
  string path = 1;
  uint32 hop = 2; // 1: edited directly; 2: callers/importers
}
message ChangeImpactEdge {
  string from_path = 1; // caller/importer
  string to_path = 2; // directly changed code
  string relation = 3; // CALLS | INCLUDES
}

// Recorded values, not estimates or signature-verification results. No prompt,
// reasoning text/signatures, task plans or arbitrary provider metadata is exposed.
message ChangeMetadata {
  uint32 schema_version = 1; // 1
  Hash change_hash = 2;
  repeated ChangeAIUsage usage = 3;
  repeated string affected_paths = 4; // actual hunks/file_ops; no content reconstruction
  repeated string warnings = 5;
  // Native atomic change statistics and per-path hunk descriptions, computed
  // from the decoded graph ops (not provenance DAG nodes or reconstructed diffs).
  // Additive: absence means the producer predates this projection, not zero.
  optional ChangeGraphSummary graph_summary = 6;
}
message ChangeGraphSummary {
  uint64 vertices_added = 1;
  uint64 edges_changed = 2;
  uint64 content_bytes = 3; // uncompressed change.contents length, not bundle size
  uint64 files_changed = 4; // unique graph-op paths; root ops have no file path
  repeated ChangeFileSummary files = 5; // canonical CLI order, includes root rows
}
// Canonical display summaries shared with atomic change. Strings contain no
// ANSI/HTML; consumers render symbol/path/info as text, not executable markup.
message ChangeFileSummary {
  string symbol = 1;
  string path = 2;
  string info = 3;
}
message ChangeAIUsage {
  uint32 record_index = 1; // occurrence within this change; not a cross-change identity
  string vendor = 2;
  string model = 3;
  optional string model_version = 4;
  string tool = 5;
  optional string request_id = 6;
  optional string session_id = 7;
  optional string session_slug = 8;
  optional uint32 step_count = 9;
  ChangeTokenUsage tokens = 10;
  // Exact millionths of USD. Absence is unknown/invalid, not zero. Legacy
  // recorded USD is converted with atomic-core Cost::from_usd, never pricing.
  optional uint64 cost_micro_usd = 11;
}
message ChangeTokenUsage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 total_tokens = 3; // reported total; do not recompute across billing categories
  uint64 cache_read_tokens = 4;
  uint64 cache_write_tokens = 5;
  uint64 reasoning_tokens = 6;
}
// One file's content around a change (add-only): what the graph
// reconstruction reads server-side for `diff -c` (the legacy
// no-file_ops fallback) and the FileOps hunks' context padding.
message ChangeFileContent {
  string path = 1;
  optional bytes before = 2;  // pre-change content (absent = none/unreadable)
  optional bytes after = 3;   // post-change content (absent = none/unreadable)
  // Distinguish a known absent side (empty diff pane) from failed reconstruction.
  // Older producers omit these; present payloads still establish their side.
  optional bool before_exists = 4;
  optional bool after_exists = 5;
  bool is_directory = 6;
}
// ChangeInfo lives in atomic/common/change.proto (shared change-domain).

message DiffRequest {
  RepositoryRef repository = 1;
  reserved 2; // working_copy moved to a LOCAL, workspace-aware method
  oneof scope {
    RefPairScope refs = 3;             // view/tag/change-pair diff
  }
  bool stat_only = 4;
  bool word_diff = 5;                  // word-level highlight inside hunks
}
message DiffWorkingCopyRequest {
  RepositoryRef repository = 1; // workspace_id required
  WorkingCopyScope working_copy = 2;
  bool stat_only = 3;
  bool word_diff = 4;           // word-level highlight inside hunks
}
message WorkingCopyScope {
  bool include_untracked = 1;
  repeated string paths = 2;           // working-copy paths (LOCAL semantics)
}
message RefPairScope {
  string from_view = 1;
  string to_view = 2;
}
message DiffChunk {
  string path = 1;
  optional bytes patch = 2;            // unified diff hunks (absent when stat-only)
  uint64 additions = 3;
  uint64 deletions = 4;
  bool binary = 5;
  // Add-only: the client renders with the same formatters the local path
  // uses ("one render, two data sources"). `status` is the DomainFileStatus
  // downcased ("added" | "deleted" | "modified" | "untracked"); the contents
  // are absent when binary or stat-only, `new_content` also when deleted.
  optional string status = 6;
  optional bytes old_content = 7;      // recorded view content
  optional bytes new_content = 8;      // working-copy content
}

message ListConflictsRequest {
  RepositoryRef repository = 1;
}
message ListConflictsResponse {
  repeated ConflictInfo conflicts = 1;
}

message PreviewMutationRequest {
  RepositoryRef repository = 1;
  reserved 2; // filesystem restore has its own LOCAL preview
  oneof operation {
    InsertPreview insert = 3;
    UnrecordPreview unrecord = 4;
  }
}
message PreviewRestoreRequest {
  RepositoryRef repository = 1; // workspace_id required
  repeated string paths = 2; // workspace-root-relative
  bool force = 3;
  // The single-file pristine-content arm (add-only): `restore --dry-run
  // <file>` dumps that one file's pristine bytes to stdout. When set, the
  // response additionally carries the path's pristine content (absent =
  // the graph holds no content for it — the CLI's not-found error).
  optional string content_path = 4;
}
message InsertPreview {
  oneof source {
    Hash single_change = 1;
    string from_view = 2;
    string up_to_tag = 3;
  }
  string target_view = 4; // required; dependency closure is always enforced
  bool allow_conflicts = 5;
}
message UnrecordPreview {
  ViewRef view = 1;
  optional ChangeRef target = 2; // absent means last change in this view
}
message PreviewMutationResponse {
  repeated string affected_paths = 1;
  repeated ChangeInfo changes = 2;
  repeated ConflictInfo conflicts = 3;
  ViewSnapshot snapshot = 4;
  // The restore preview's would-untrack list (add-only): Added files
  // that a restore would untrack but keep on disk.
  repeated string untracked = 5;
  // The single-file restore preview's pristine bytes (add-only): present
  // iff the request named a content_path the graph holds content for.
  optional bytes pristine_content = 6;
  // Observed working-copy view for the pristine_content read. A foreign
  // consumer must not label another view's bytes as the displayed baseline.
  optional string view = 7;
}
// ConflictInfo lives in atomic/common/change.proto (shared change-domain).
