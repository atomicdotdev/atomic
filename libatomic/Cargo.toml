[package]
name = "libatomic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The canonical Atomic contract: protobuf service definitions, tonic/prost codegen, the descriptor contract gate, and the reference implementation of the contract"

[dependencies]
# Domain crates — the handlers execute on these.
atomic-agent = { workspace = true }
atomic-canonical = { workspace = true }
atomic-core = { workspace = true }
atomic-identity = { workspace = true }
atomic-repository = { workspace = true }
atomic-semantic = { workspace = true }

# gRPC: the generated contract (this crate owns the codegen).
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

# Async: the handlers are async and offload database work to the blocking pool.
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures-core = { workspace = true }

# Domain support.
serde_json = { workspace = true }
chrono = { workspace = true }
blake3 = { workspace = true }
data-encoding = { workspace = true }
similar = { workspace = true }
ulid = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
protox = { workspace = true }
